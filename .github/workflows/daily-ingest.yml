name: Daily ingest

on:
  schedule:
    # 23:00 UTC every day — captures all of that day's news,
    # site shows it as "yesterday" from midnight onwards.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest

      - name: Commit new articles
        run: |
          git config user.name "aidigest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new articles."
          else
            git commit -m "chore: daily ingest $(date -u +%Y-%m-%d)"
            git push
          fi
